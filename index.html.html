<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D PVE Shooter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;background:#1119;padding:8px 24px;border-radius:12px;font-weight:800}
#hp{position:absolute;right:16px;top:max(12px,env(safe-area-inset-top));background:#111b;padding:8px 12px;border-radius:12px}
#hpbar{width:150px;height:10px;background:#555;border-radius:9px;overflow:hidden;margin-top:5px}
#hpfill{height:100%;width:100%;background:#ef4444}
#ammo{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;padding:10px 22px;border-radius:14px;font-size:22px;font-weight:900}
#cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{width:28px;height:2px;top:13px}
#cross:after{width:2px;height:28px;left:13px}
#fire{position:absolute;pointer-events:auto;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));width:92px;height:92px;border:3px solid #fff8;border-radius:50%;background:#e33b3bcc;color:white;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center}
#fire:active{background:#ff6655}
#joystick{position:absolute;pointer-events:auto;left:22px;bottom:25px;width:150px;height:150px;border:2px solid #fff6;border-radius:50%;background:#1115}
#stick{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff77;border:2px solid #fff9}
#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}
#hint{position:absolute;right:18px;bottom:20px;background:#1119;padding:8px 12px;border-radius:9px;font-size:12px;opacity:.8}
#start,#over{position:fixed;inset:0;background:linear-gradient(#07101ddd,#000e),radial-gradient(circle at center,#25384b,#05070a);z-index:10;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{width:min(90%,460px);padding:28px;border-radius:22px;background:#111d;border:1px solid #ffffff22;box-shadow:0 20px 70px #0008}
h1{margin:0 0 10px;font-size:34px}.sub{opacity:.75;margin-bottom:24px;line-height:1.5}
button{border:0;border-radius:14px;padding:15px 28px;background:#e83e35;color:#fff;font-size:20px;font-weight:900}
.hidden{display:none!important}
#stage{font-size:14px;opacity:.85}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top"><div id="stage">STAGE 1</div><div id="objective">적을 모두 처치하세요</div></div>
  <div id="hp">HP <b id="hptext">100</b>/100<div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="cross"></div>
  <div id="ammo">30 / ∞</div>
  <div id="fire">●</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="look"></div>
  <div id="hint">왼쪽 위: 공격 · 왼쪽 아래: 이동 · 오른쪽: 시점</div>
</div>
<div id="start"><div class="panel">
  <h1>3D PVE SHOOTER</h1>
  <div class="sub">1인용 1인칭 PVE<br>무한 탄약 · 모바일 터치 조작</div>
  <button id="startBtn">게임 시작</button>
</div></div>
<div id="over" class="hidden"><div class="panel">
  <h1 id="resultTitle">STAGE CLEAR</h1>
  <div class="sub" id="resultText"></div>
  <button id="restartBtn">다시 시작</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,player,gun,clock;
let enemies=[],bullets=[],effects=[];
let running=false,stage=1,hp=100,kills=0,fireHeld=false;
let yaw=0,pitch=-0.18;
const move={x:0,y:0}, joy={active:false,id:null,cx:0,cy:0};
const look={active:false,id:null,x:0,y:0};
const $=id=>document.getElementById(id);

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x7890a4);
 scene.fog=new THREE.Fog(0x7890a4,35,115);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 document.getElementById('game').appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xbfd8ff,0x35402f,2.2));
 const sun=new THREE.DirectionalLight(0xffffff,2.4); sun.position.set(-20,35,15); sun.castShadow=true; scene.add(sun);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x4b5654,roughness:1}));
 ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
 for(let i=0;i<35;i++) addCrate((Math.random()-.5)*80,(Math.random()-.5)*65);
 for(let i=0;i<12;i++) addBarrier((Math.random()-.5)*75,(Math.random()-.5)*65);

 player=new THREE.Group(); player.position.set(0,0,10); scene.add(player);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.0,5,10),new THREE.MeshStandardMaterial({color:0x253342}));
 body.position.y=1.05; body.castShadow=true; player.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),new THREE.MeshStandardMaterial({color:0xc18e72}));
 head.position.set(0,1.85,0); head.castShadow=true; player.add(head);
 gun=new THREE.Group();
 const barrel=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,1.0),new THREE.MeshStandardMaterial({color:0x20242a}));
 barrel.position.set(.42,1.3,-.55); barrel.rotation.x=-.02; gun.add(barrel); player.add(gun);

 resetStage();
 animate();
}
function addCrate(x,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2,1.5+Math.random()*2,2+Math.random()*2),new THREE.MeshStandardMaterial({color:0x56616a}));
 m.position.set(x,m.geometry.parameters.height/2,z); m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
function addBarrier(x,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(6,1.1,.45),new THREE.MeshStandardMaterial({color:0x35434a}));
 m.position.set(x,.55,z);m.rotation.y=Math.random()*Math.PI;scene.add(m);
}
function spawnEnemy(){
 const a=Math.random()*Math.PI*2,d=22+Math.random()*28;
 const e=new THREE.Group(); e.position.set(Math.cos(a)*d,0,Math.sin(a)*d);
 const mat=new THREE.MeshStandardMaterial({color:0x8d3e43});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.95,5,9),mat);body.position.y=1;body.castShadow=true;e.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),new THREE.MeshStandardMaterial({color:0x4d1f22}));
 head.position.y=1.75;head.castShadow=true;e.add(head);
 e.userData={hp:3,speed:1.25+Math.random()*.6,attack:0};
 scene.add(e);enemies.push(e);
}
function resetStage(){
 enemies.forEach(e=>scene.remove(e));enemies=[];
 bullets.forEach(b=>scene.remove(b));bullets=[];
 stage=Math.max(1,stage);kills=0;hp=100;player.position.set(0,0,10);
 const count=4+stage*2;
 for(let i=0;i<count;i++)spawnEnemy();
 $('stage').textContent='STAGE '+stage;
 $('hptext').textContent=hp;$('hpfill').style.width=hp+'%';
 $('objective').textContent='적 '+count+'명 처치';
 running=true;
}
function shoot(){
 if(!running)return;
 // Fire exactly through the center crosshair.
 camera.updateMatrixWorld();
 const start=new THREE.Vector3();
 camera.getWorldPosition(start);
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();
 start.addScaledVector(dir,0.7);
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:0xffe08a}));
 mesh.position.copy(start);scene.add(mesh);
 bullets.push({mesh,dir,life:1.4});
}
let lastShot=0;
function damageEnemy(e){
 e.userData.hp--;
 e.scale.setScalar(1.08);
 setTimeout(()=>e.scale.setScalar(1),50);
 if(e.userData.hp<=0){
  scene.remove(e); enemies=enemies.filter(x=>x!==e);kills++;
  if(enemies.length===0){running=false;showClear();}
 }
}
function showClear(){
 $('resultTitle').textContent='STAGE '+stage+' CLEAR';
 $('resultText').textContent='모든 적을 처치했습니다. 다음 스테이지로 진행합니다.';
 $('over').classList.remove('hidden');
 $('restartBtn').textContent='다음 스테이지';
}
function gameOver(){
 running=false;$('resultTitle').textContent='GAME OVER';$('resultText').textContent='다시 도전해보세요.';$('over').classList.remove('hidden');$('restartBtn').textContent='다시 시작';
}
function update(dt){
 // First-person movement. Joystick UP is always forward, DOWN is always backward.
 const speed=6;
 const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
 const velocity=new THREE.Vector3()
   .addScaledVector(forward,-move.y)
   .addScaledVector(right,move.x);
 if(velocity.lengthSq()>1) velocity.normalize();
 player.position.addScaledVector(velocity,speed*dt);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-70,70);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);

 // First-person camera: eye-level, no third-person orbit.
 camera.position.set(player.position.x,1.65,player.position.z);
 const cp=Math.cos(pitch), sp=Math.sin(pitch);
 const lookDir=new THREE.Vector3(
   Math.sin(yaw)*cp,
   sp,
   -Math.cos(yaw)*cp
 );
 camera.lookAt(camera.position.clone().add(lookDir.multiplyScalar(20)));

 enemies.forEach(e=>{
  const v=new THREE.Vector3().subVectors(player.position,e.position);v.y=0;
  const dist=v.length();
  if(dist>2.1){
    v.normalize();
    e.position.addScaledVector(v,e.userData.speed*dt);
    e.lookAt(player.position.x,0,player.position.z);
  } else {
    e.userData.attack-=dt;
    if(e.userData.attack<=0){
      hp-=5;e.userData.attack=0.8;
      $('hptext').textContent=Math.max(0,hp);
      $('hpfill').style.width=Math.max(0,hp)+'%';
      if(hp<=0)gameOver();
    }
  }
  e.position.y=0;
 });
 bullets.forEach((b,i)=>{
  b.mesh.position.addScaledVector(b.dir,45*dt);b.life-=dt;
  for(const e of enemies){
   if(b.mesh.position.distanceTo(e.position.clone().setY(1))<1.05){
    damageEnemy(e);b.life=0;break;
   }
  }
  if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1)}
 });
 if(fireHeld && performance.now()-lastShot>150){
  shoot();lastShot=performance.now();
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.033);
 if(running)update(dt);
 renderer.render(scene,camera);
}
function bindTouch(){
 const joyEl=$('joystick'),stick=$('stick');
 joyEl.addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;joy.cx=e.clientX;joy.cy=e.clientY;joyEl.setPointerCapture(e.pointerId)});
 joyEl.addEventListener('pointermove',e=>{if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const r=58,l=Math.hypot(dx,dy);if(l>r){dx*=r/l;dy*=r/l}stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;move.x=dx/r;move.y=dy/r});
 function joyUp(e){if(e.pointerId!==joy.id)return;joy.active=false;move.x=move.y=0;stick.style.transform='translate(-50%,-50%)'}
 joyEl.addEventListener('pointerup',joyUp);joyEl.addEventListener('pointercancel',joyUp);

 const lookEl=$('look');
 lookEl.addEventListener('pointerdown',e=>{look.active=true;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;lookEl.setPointerCapture(e.pointerId)});
 lookEl.addEventListener('pointermove',e=>{if(!look.active||e.pointerId!==look.id)return;const dx=e.clientX-look.x,dy=e.clientY-look.y;look.x=e.clientX;look.y=e.clientY;yaw+=dx*.008;pitch=THREE.MathUtils.clamp(pitch-dy*.006,-.65,.35)});
 const lookUp=e=>{if(e.pointerId===look.id)look.active=false};lookEl.addEventListener('pointerup',lookUp);lookEl.addEventListener('pointercancel',lookUp);

 const fire=$('fire');
 fire.addEventListener('pointerdown',e=>{fireHeld=true;fire.setPointerCapture(e.pointerId);shoot();lastShot=performance.now()});
 const stop=()=>fireHeld=false;fire.addEventListener('pointerup',stop);fire.addEventListener('pointercancel',stop);fire.addEventListener('pointerleave',stop);
}
$('startBtn').onclick=()=>{$('start').classList.add('hidden');init()};
$('restartBtn').onclick=()=>{ $('over').classList.add('hidden'); if($('resultTitle').textContent.includes('CLEAR'))stage++; else stage=1;resetStage()};
addEventListener('resize',()=>{if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
bindTouch();
</script>
</body>
</html>
